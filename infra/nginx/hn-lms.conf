upstream hn_lms_web { server 127.0.0.1:3000; keepalive 32; }
upstream hn_lms_api { server 127.0.0.1:4000; keepalive 32; }

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 20m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location = /healthz {
        access_log off;
        proxy_pass http://hn_lms_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-Id $request_id;
        add_header X-Correlation-Id $request_id always;
    }

    location = /readyz {
        access_log off;
        proxy_pass http://hn_lms_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-Id $request_id;
        add_header X-Correlation-Id $request_id always;
    }

    # Metrics are intentionally available only to a local collector. The API owns metric content.
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://hn_lms_api/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-Id $request_id;
    }

    location /api/ {
        proxy_pass http://hn_lms_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $request_id;
        add_header X-Correlation-Id $request_id always;
    }

    location / {
        proxy_pass http://hn_lms_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $request_id;
        add_header X-Correlation-Id $request_id always;
    }
}
